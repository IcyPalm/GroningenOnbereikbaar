server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

    # Don't expose nginx version
    server_tokens off;

    # Redirects (/nieuws -> /nieuws/) stay relative, so they work behind the Coolify proxy
    absolute_redirect off;

    # Security headers (inherited by every location below that doesn't set its own add_header)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://umami.marijnpool.nl; connect-src 'self' https://umami.marijnpool.nl; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'self'" always;

    # Health check endpoint for Coolify
    location /healthz {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Static assets. No content hashes in the filenames, so keep css/js cache short.
    location ~* \.(css|js)$ {
        expires 1h;
    }
    location ~* \.(webp|png|svg|ico)$ {
        expires 30d;
    }

    # Clean URLs: each page lives in its own directory as index.html
    location / {
        try_files $uri $uri/ =404;
    }

    # Custom error page
    error_page 404 /404.html;
    location = /404.html { internal; }
}
